services:
  ts-vault:
    image: tailscale/tailscale:latest
    hostname: ts-vault
    cap_add: [ "NET_ADMIN", "SYS_MODULE" ]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ts_state:/var/lib/tailscale
      - ./certs:/staging-certs:ro
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTHKEY=${VAULT_AUTHKEY}
      - TS_HOSTNAME=vault
      - TS_ACCEPT_DNS=true
      - TS_AUTH_ONCE=true
      - TS_EXTRA_ARGS=--login-server=https://${HEADSCALE_DOMAIN}
      - SSL_CERT_DIR=${SSL_CERT_DIR}
      - TS_USERSPACE=false
      - TS_TAILSCALED_EXTRA_ARGS=--tun=tailscale0
    restart: unless-stopped

  vaultwarden-lan:
    image: vaultwarden/server:latest
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - DOMAIN=https://${LAN_DOMAIN}
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - ./bitwarden:/data
    restart: unless-stopped

  vaultwarden-lab:
    image: vaultwarden/server:latest
    network_mode: "service:ts-vault"
    environment:
      - DOMAIN=https://passwords.${LAB_DOMAIN}
      - ROCKET_PORT=8081
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - ./bitwarden:/data
    depends_on:
      - vaultwarden-lan
    restart: unless-stopped

  consul-register:
    image: curlimages/curl:8.8.0
    network_mode: "service:ts-vault"
    environment:
      - CONSUL_ADDR=http://${INFRA_VPS_TAILNET_IP}:8500
      - SERVICE_NAME=vaultwarden
      - SERVICE_ID=vaultwarden-vault
      - SERVICE_HOST=vault.${TAILNET_DOMAIN}
      - SERVICE_PORT=8081
      - ROUTE_HOST=passwords.${LAB_DOMAIN}
    command: >
      sh -c '
        RULE=$(echo "Host(__H__)" | sed "s/__H__/\`$$ROUTE_HOST\`/");
        PAYLOAD="{
          \"Name\": \"$$SERVICE_NAME\",
          \"ID\": \"$$SERVICE_ID\",
          \"Address\": \"$$SERVICE_HOST\",
          \"Port\": $$SERVICE_PORT,
          \"Tags\": [
            \"traefik.enable=true\",
            \"traefik.http.routers.$$SERVICE_NAME.rule=$$RULE\",
            \"traefik.http.routers.$$SERVICE_NAME.entrypoints=websecure\",
            \"traefik.http.routers.$$SERVICE_NAME.tls=true\",
            \"traefik.http.routers.$$SERVICE_NAME.tls.certresolver=dns\"
          ],
          \"Check\": {
            \"TCP\": \"$$SERVICE_HOST:$$SERVICE_PORT\",
            \"Interval\": \"10s\",
            \"DeregisterCriticalServiceAfter\": \"2m\"
          }
        }";
        while true; do
          if curl -sf -X PUT "$$CONSUL_ADDR/v1/agent/service/register" \
               -H "Content-Type: application/json" \
               -d "$$PAYLOAD"; then
            echo "Registered $$SERVICE_ID";
          else
            echo "Failed to register $$SERVICE_ID, retrying in 60s...";
          fi;
          sleep 60;
        done
      '
    depends_on:
      - ts-vault
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    network_mode: "service:ts-vault"
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./tailnet/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - ts-vault
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: "service:ts-vault"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    depends_on:
      - ts-vault
    restart: unless-stopped

  # ── LAN-side observability (Slice 4) ────────────────────────────────────
  # A second node-exporter + promtail bound to the HOST network (no
  # ts-vault netns) so kaiser's cn-observability can scrape passwords.lan
  # independently of the tailnet path. Their watchdog-managed siblings
  # above continue reporting to the VPS Prometheus/Loki via tailnet.
  # node-exporter-lan binds :9100 inside the host netns; the ts-vault one
  # binds :9100 inside the tailnet netns — different netns, no conflict.
  node-exporter-lan:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--web.listen-address=:9100"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Resilience: reconcile-stack.sh writes resilience_* metrics into this dir.
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    restart: unless-stopped

  promtail-lan:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./lan/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_lan_positions:/tmp
    restart: unless-stopped

  backup:
    image: offen/docker-volume-backup:latest
    volumes:
      - ./bitwarden:/backup/bitwarden:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - BACKUP_CRON_EXPRESSION=0 3 * * 0
      - BACKUP_FILENAME=vaultwarden-%Y-%m-%dT%H-%M-%S.tar.gz
      - BACKUP_RETENTION_DAYS=56
      - AWS_S3_BUCKET_NAME=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${BACKUP_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${BACKUP_AWS_SECRET_ACCESS_KEY}
      - AWS_S3_REGION=${BACKUP_AWS_REGION}
      - AWS_S3_PATH=vaultwarden/
      - WEBDAV_URL=${BACKUP_WEBDAV_URL}
      - WEBDAV_PATH=/vaultwarden/
      - WEBDAV_USERNAME=${BACKUP_WEBDAV_USER}
      - WEBDAV_PASSWORD=${BACKUP_WEBDAV_PASSWORD}
      - NOTIFICATION_URLS=smtp://${SMTP_USERNAME}:${SMTP_PASSWORD}@${SMTP_HOST}:${SMTP_PORT}/?from=${SMTP_FROM}&to=${ALERT_EMAIL}&starttls=yes
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    command:
      - "--cleanup"
      - "--schedule=0 0 3 * * *"
      - "--notification-url=smtp://${SMTP_USERNAME}:${SMTP_PASSWORD}@${SMTP_HOST}:${SMTP_PORT}/?from=${SMTP_FROM}&to=${ALERT_EMAIL}&starttls=yes"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.45
    restart: unless-stopped

  # ── ts-vault watchdog: force-recreate dependents on netns drift ──
  # Detects drift by comparing each dependent's HostConfig.NetworkMode
  # ("container:<id>") against ts-vault's current container ID. Self-heals
  # on its own first poll, silently no-ops in steady state. Also restarts
  # dependents stuck in non-running status (e.g. Created-but-never-started
  # after a midway compose failure).
  # The drift threshold (3 polls = 30s) prevents the watchdog from racing
  # systemd's own `docker compose up` during a stack-wide recreate: a
  # legitimate compose-up resettles dependents in <30s, so transient drift
  # is ignored; real netns drift after a tailscaled crash persists, so the
  # watchdog still fires within ~30s.
  ts-vault-watchdog:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    command:
      - /bin/sh
      - -c
      - |
        until apk add --no-cache docker-cli-compose >/dev/null 2>&1; do echo "[watchdog] waiting for network to install docker-cli-compose"; sleep 5; done
        DEPS="consul-register vaultwarden-lab promtail node-exporter"
        ACTION_THRESHOLD=3
        ACTION_COUNT=0
        echo "[watchdog] ready, polling dependents every 10s ($$DEPS), drift threshold $$ACTION_THRESHOLD polls"
        while true; do
          TS_ID=$$(docker inspect cn-vaultwarden-ts-vault-1 --format "{{.Id}}" 2>/dev/null || true)
          if [ -n "$$TS_ID" ]; then
            NEED_RECREATE=""
            NEED_START=""
            for dep in $$DEPS; do
              INFO=$$(docker inspect cn-vaultwarden-$$dep-1 --format "{{.HostConfig.NetworkMode}} {{.State.Status}}" 2>/dev/null || true)
              [ -n "$$INFO" ] || continue
              DEP_NM=$$(echo "$$INFO" | awk "{print \$$1}")
              DEP_STATUS=$$(echo "$$INFO" | awk "{print \$$2}")
              DEP_TARGET=$${DEP_NM#container:}
              if [ "$$DEP_TARGET" != "$$TS_ID" ]; then
                NEED_RECREATE="$$NEED_RECREATE $$dep"
              elif [ "$$DEP_STATUS" != "running" ]; then
                NEED_START="$$NEED_START $$dep"
              fi
            done
            if [ -n "$$NEED_RECREATE" ] || [ -n "$$NEED_START" ]; then
              ACTION_COUNT=$$((ACTION_COUNT + 1))
              if [ "$$ACTION_COUNT" -ge "$$ACTION_THRESHOLD" ]; then
                if [ -n "$$NEED_RECREATE" ]; then
                  echo "[watchdog] persistent drift on:$$NEED_RECREATE -- recreating"
                  docker compose -p cn-vaultwarden up -d --force-recreate --no-deps $$NEED_RECREATE \
                    && echo "[watchdog] recreate OK" || echo "[watchdog] recreate FAILED"
                fi
                if [ -n "$$NEED_START" ]; then
                  echo "[watchdog] persistent stopped on:$$NEED_START -- starting"
                  docker compose -p cn-vaultwarden start $$NEED_START \
                    && echo "[watchdog] start OK" || echo "[watchdog] start FAILED"
                fi
                ACTION_COUNT=0
              else
                echo "[watchdog] action pending (drift:$$NEED_RECREATE start:$$NEED_START count=$$ACTION_COUNT/$$ACTION_THRESHOLD)"
              fi
            else
              ACTION_COUNT=0
            fi
          fi
          sleep 10
        done
    restart: unless-stopped

  traefik-lan:
    image: traefik:v3.6.9
    network_mode: host
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--certificatesresolvers.stepca.acme.caserver=https://${PKI_IP}:9000/acme/acme/directory"
      - "--certificatesresolvers.stepca.acme.email=${ADMIN_EMAIL}"
      - "--certificatesresolvers.stepca.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.stepca.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    environment:
      - LEGO_CA_CERTIFICATES=/certs/root_ca.crt
    volumes:
      - ./traefik-lan/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_lan_acme:/acme
      - ./certs/root_ca.crt:/certs/root_ca.crt:ro
    # Pre-resolve pki.lan: under network_mode: host on this Docker
    # version the container ships an empty resolv.conf, so the ACME
    # client can't reach step-ca if the host's DNS races at boot.
    # Without this, the 24h step-ca leaf expires silently and every
    # *.passwords.lan probe goes 5xx. Hit on 2026-06-23 ~00:46Z.
    extra_hosts:
      - "pki.lan:10.0.0.250"
    restart: unless-stopped


volumes:
  ts_state:
  traefik_lan_acme:
  promtail_lan_positions:
